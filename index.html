<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indianan Ride</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    a {
      display: block;
      position: relative;
      width: 100%;
      height: 100%;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .play-btn {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 90px;
      height: 62px;
      transform: translate(-50%, -50%);
      border-radius: 16px;
      background: #ff0000;
    }

    .play-btn::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-42%, -50%);
      border-style: solid;
      border-width: 16px 0 16px 28px;
      border-color: transparent transparent transparent #fff;
    }
  </style>
</head>
<body>
  <a href="https://www.youtube.com/watch?v=yUGwvwG9fFk">
    <img
      src="https://i.ytimg.com/vi/yUGwvwG9fFk/maxresdefault.jpg"
      alt="Indianan Ride"
    >
    <span class="play-btn"></span>
  </a>
</body>
</html>
