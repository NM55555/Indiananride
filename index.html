<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    a {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    a:hover img {
      opacity: 1;
    }
    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 56px;
      background: rgba(255, 0, 0, 0.9);
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .play-btn::after {
      content: "";
      border-style: solid;
      border-width: 14px 0 14px 26px;
      border-color: transparent transparent transparent #fff;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <a href="https://youtube.com">
    <img src="https://youtube.com" alt="Play Video">
    <div class="play-btn"></div>
  </a>
</body>
</html>
