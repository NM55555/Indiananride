<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    a {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 62px;
      background: #ff0000;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    .play-btn::after {
      content: "";
      border-style: solid;
      border-width: 16px 0 16px 28px;
      border-color: transparent transparent transparent #fff;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <a href="https://youtube.com">
    <img src="https://ytimg.com" alt="Start Ride">
    <div class="play-btn"></div>
  </a>
</body>
</html>
