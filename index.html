<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Indianan Ride</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    #cover {
      width: 100%;
      height: 100%;
      position: relative;
      cursor: pointer;
      background: #000 url("https://i.ytimg.com/vi/yUGwvwG9fFk/maxresdefault.jpg") center / cover no-repeat;
    }

    #play {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 90px;
      height: 62px;
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 16px;
      background: #ff0000;
      cursor: pointer;
    }

    #play::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-42%, -50%);
      border-style: solid;
      border-width: 16px 0 16px 28px;
      border-color: transparent transparent transparent #fff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="cover" role="button" tabindex="0" aria-label="Play Indianan Ride">
    <button id="play" aria-label="Play video"></button>
  </div>

  <script>
    const cover = document.getElementById("cover");

    function playVideo() {
      cover.outerHTML = `
        <iframe
          src="https://www.youtube-nocookie.com/embed/yUGwvwG9fFk?autoplay=1"
          title="Indianan Ride"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>`;
    }

    cover.addEventListener("click", playVideo);
    cover.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        playVideo();
      }
    });
  </script>
</body>
</html>
